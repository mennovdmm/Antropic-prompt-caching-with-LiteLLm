version: '3.8'

services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ../configs/litellm-config.yaml:/litellm/config.yaml
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Optional: Enable debug logging
      - LITELLM_LOG=DEBUG
    command: --config /litellm/config.yaml
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.anthropic.cache=enabled"
      - "com.anthropic.savings=90%"

  # Optional: Langflow service (if not running separately)
  langflow:
    image: langflowai/langflow:1.5.0.post2
    container_name: langflow-production
    ports:
      - "7860:7860"
    volumes:
      - langflow-data:/app/data
      - langflow-flows:/app/flows
    environment:
      - LANGFLOW_DATABASE_URL=sqlite:////app/data/langflow.db
      - LANGFLOW_CONFIG_DIR=/app/data
      - LANGFLOW_LOG_LEVEL=INFO
      # Important: Use container name for LiteLLM connection
      - LITELLM_BASE_URL=http://litellm-proxy:4000/v1
      - LITELLM_API_KEY=sk-litellm-master-2024
    networks:
      - langflow-network
    depends_on:
      - litellm-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  langflow-network:
    driver: bridge
    name: langflow-network

volumes:
  langflow-data:
  langflow-flows: