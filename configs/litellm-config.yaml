model_list:
  - model_name: claude-sonnet-4-cached
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY  # Set via environment variable
      extra_headers:
        anthropic-beta: prompt-caching-2024-07-31
      # OFFICIAL CACHE INJECTION!
      cache_control_injection_points:
        - location: message
          role: system
          type: ephemeral
      
  - model_name: claude-opus-4-cached
    litellm_params:
      model: anthropic/claude-opus-4-1-20250805
      api_key: os.environ/ANTHROPIC_API_KEY  # Set via environment variable
      extra_headers:
        anthropic-beta: prompt-caching-2024-07-31
      cache_control_injection_points:
        - location: message
          role: system
          type: ephemeral

litellm_settings:
  drop_params: false
  set_verbose: true
  
general_settings:
  master_key: sk-litellm-master-2024
